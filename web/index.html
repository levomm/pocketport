<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070a09" />
  <meta name="description" content="PocketPort checks whether desktop-first GitHub projects can run on Android and Termux." />
  <title>PocketPort</title>
  <link rel="icon" type="image/svg+xml" href="/assets/pocketport-mark.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css?v=2" />
  <link rel="stylesheet" href="/refresh.css?v=4" />
</head>
<body>
  <div id="pp-intro" class="pp-intro" aria-hidden="true">
    <div class="pp-intro-grid"></div>
    <div class="pp-intro-horizon"></div>
    <div class="pp-intro-portal"></div>
    <div class="pp-intro-core"></div>
    <div class="pp-intro-streaks"></div>
    <div class="pp-intro-logo-stack">
      <img class="pp-intro-logo pp-intro-logo-main" src="/assets/pocketport-logo.svg" alt="" />
      <img class="pp-intro-logo pp-intro-logo-ghost pp-intro-logo-ghost-a" src="/assets/pocketport-logo.svg" alt="" />
      <img class="pp-intro-logo pp-intro-logo-ghost pp-intro-logo-ghost-b" src="/assets/pocketport-logo.svg" alt="" />
    </div>
    <div class="pp-intro-scanline"></div>
  </div>

  <div class="app-shell">
    <header class="topbar">
      <button class="brand" type="button" data-nav="/" aria-label="PocketPort home">
        <img class="brand-logo" src="/assets/pocketport-logo.svg" alt="PocketPort" />
      </button>
      <button class="target-pill" type="button" data-nav="/target" aria-label="Target device settings">
        <span class="target-dot"></span>
        <span id="target-pill-text">Android · arm64</span>
      </button>
    </header>

    <main id="app" tabindex="-1"></main>
  </div>

  <div id="sheet-backdrop" class="sheet-backdrop" hidden></div>
  <section id="sheet" class="sheet" aria-modal="true" role="dialog" hidden>
    <div class="sheet-grabber"></div>
    <div class="sheet-head">
      <div>
        <p id="sheet-kicker" class="eyebrow"></p>
        <h2 id="sheet-title"></h2>
      </div>
      <button id="sheet-close" class="icon-button" type="button" aria-label="Close">×</button>
    </div>
    <div id="sheet-body" class="sheet-body"></div>
  </section>

  <script>
    (() => {
      const intro = document.getElementById('pp-intro');
      if (!intro) return;
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        intro.remove();
        return;
      }
      let finished = false;
      const finish = () => {
        if (finished) return;
        finished = true;
        intro.classList.add('is-done');
        window.setTimeout(() => intro.remove(), 520);
      };
      window.setTimeout(finish, 3000);
      intro.addEventListener('click', finish, { once: true });
    })();
  </script>
  <script src="/adapter.js"></script>
  <script src="/app.js?v=3"></script>
  <script src="/bridge-probe.js?v=8"></script>
</body>
</html>
