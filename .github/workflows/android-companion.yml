name: android-companion

on:
  pull_request:
    paths:
      - "android-companion/**"
      - ".github/workflows/android-companion.yml"
  push:
    branches: [main]
    paths:
      - "android-companion/**"
      - ".github/workflows/android-companion.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 37
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Unit tests
        run: gradle -p android-companion :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle -p android-companion :app:assembleDebug --stacktrace

      - name: Stage APK
        run: |
          mkdir -p artifacts
          cp android-companion/app/build/outputs/apk/debug/app-debug.apk artifacts/pocketport-companion-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: pocketport-companion-debug
          path: artifacts/pocketport-companion-debug.apk
          if-no-files-found: error
