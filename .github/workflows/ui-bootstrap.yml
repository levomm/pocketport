name: ui-bootstrap

on:
  push:
    branches: ["feature/mobile-ui"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mobile-ui
      - name: Unpack mobile UI
        run: |
          mkdir -p web
          tar -xzf .ui-bundle.tar.gz -C web
          rm .ui-bundle.tar.gz
      - name: Commit UI files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+levomm@users.noreply.github.com
          git add -A
          git commit -m "web: add mobile-first PocketPort interface"
          git push origin HEAD:feature/mobile-ui
