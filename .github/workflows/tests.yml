name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check browser JavaScript syntax
        run: node --check web/bridge-probe.js
      - name: Install
        run: python -m pip install -e . pytest
      - name: Test
        run: pytest -q
