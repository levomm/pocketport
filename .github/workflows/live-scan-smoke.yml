name: live-scan-smoke

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PocketPort
        run: python -m pip install -e .
      - name: Scan a real public GitHub repository
        run: |
          python - <<'PY'
          from pocketport.live_scan import scan_public_github

          report = scan_public_github("https://github.com/octocat/Hello-World")
          assert report["repository"] == "https://github.com/octocat/Hello-World"
          assert report["path"] == "octocat/Hello-World"
          assert isinstance(report["score"], int)
          assert report["strategy"] in {"native", "hybrid", "proot"}
          assert isinstance(report["findings"], list)

          plan = report["execution_plan"]
          assert plan["status"] in {"ready", "installable", "fallback"}
          assert plan["method"] in {"source", "proot"}
          assert plan["target"]["platform"] == "android"
          assert plan["target"]["arch"] == "aarch64"
          assert isinstance(plan["install"], list)
          assert isinstance(plan["run"], list)
          assert isinstance(plan["component"], dict)
          print(report)
          PY
